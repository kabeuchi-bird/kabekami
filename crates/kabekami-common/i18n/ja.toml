# kabekami 日本語 UI 文字列
#
# このファイルをコピーして言語コードのファイル名（例: fr.toml）で
# 下記のいずれかに置くと、再ビルドなしで言語が増えます。
#
#   /usr/share/kabekami/i18n/    システム全体
#   ~/.config/kabekami/i18n/     ユーザー個別（こちらが優先）
#
# 同じ言語コードのファイルは重ね合わせになります。訳語を 1 つだけ変えたい
# 場合は、そのキーだけを書いた短いファイルを優先度の高い場所に置けば十分です。
#
#   # ~/.config/kabekami/i18n/ja.toml
#   [tray]
#   quit = "おわり"
#
# どこにも書かれていないキーは英語にフォールバックするため、部分的な翻訳でも
# 問題なく動作します。

display_name = "日本語"

# ── デーモン（トレイメニュー・通知） ──────────────────────────────────────────
[tray]
next_wallpaper    = "次の壁紙"
prev_wallpaper    = "前の壁紙"
pause             = "一時停止"
resume            = "再開"
display_mode      = "表示モード"
interval          = "切り替え間隔"
open_current      = "現在の壁紙を開く"
delete_current    = "ゴミ箱に移動"
blacklist_current = "二度と表示しない"
copy_to_favorites = "お気に入りに追加"
quit              = "終了"
open_settings     = "設定を開く"
# 画像枚数の単位
images            = "枚"

# {} にはファイル名が入る
tooltip_current   = "現在: {}"
# {} にはエラー本文が入る
tooltip_error     = "エラー: {}"

notify_failed     = "壁紙の設定に失敗しました"
notify_warning    = "kabekami 警告"
notify_fetch_title = "オンラインソース"
# {provider} = プロバイダー名, {count} = 取得枚数
notify_fetch_body = "{provider} から {count} 枚の画像をダウンロードしました"

# 切り替え間隔メニューのラベル。tray::INTERVAL_PRESETS と同じ順序・件数（6 件）にすること
interval_labels   = ["10秒", "30秒", "5分", "30分", "1時間", "3時間"]

